<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ralstonia Web App – Cơ sở dữ liệu RSSC (Tự động cập nhật)</title>
<style>
  :root{
    --bg:#f4f7f6; --surface:#ffffff; --text:#1b2a30; --muted:#5f727a;
    --primary:#0d5c4d; --primary-light:#e6f4f0; --accent:#b03a2e;
    --accent-light:#fdecea; --border:#d8e3df; --shadow:0 2px 10px rgba(0,0,0,.05);
    --radius:12px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  body.dark{
    --bg:#0d171c; --surface:#152229; --text:#e4efec; --muted:#93a8b0;
    --primary:#4cc9b0; --primary-light:#1a3733; --accent:#f1948a;
    --accent-light:#3a1f1c; --border:#273b42; --shadow:0 2px 10px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{margin:0; font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.65; font-size:15px; transition:background .2s,color .2s;}
  header{background:linear-gradient(135deg,#0d5c4d,#1a7a66); color:#fff; padding:1.8rem 1rem 1.4rem;}
  header h1{margin:0 0 .2rem; font-size:1.45rem; letter-spacing:-.3px;}
  header p{margin:0; font-size:.85rem; opacity:.92;}
  .header-badge{display:inline-block; background:rgba(255,255,255,.18); border-radius:20px; padding:.15rem .65rem; font-size:.72rem; font-weight:600; margin-top:.45rem;}
  .update-panel{background:var(--surface); border-bottom:1px solid var(--border); padding:.6rem .9rem; display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;}
  .update-btn{background:var(--primary); color:#fff; border:none; border-radius:20px; padding:.45rem .9rem; font-size:.82rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:.3rem; transition:opacity .15s;}
  .update-btn:hover{opacity:.85;} .update-btn:disabled{opacity:.5; cursor:not-allowed;}
  .update-status{font-size:.78rem; color:var(--muted); flex:1; min-width:150px;} .update-status.success{color:var(--primary); font-weight:600;} .update-status.error{color:var(--accent); font-weight:600;}
  .toolbar{position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.5rem .8rem; box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .search-row{display:flex; gap:.5rem; align-items:center;}
  .search-input{flex:1; border:1px solid var(--border); border-radius:24px; padding:.5rem .9rem; font-size:.9rem; background:var(--bg); color:var(--text); outline:none;}
  .search-input:focus{border-color:var(--primary);}
  .theme-btn{background:var(--primary-light); color:var(--primary); border:1px solid var(--border); border-radius:20px; padding:.4rem .7rem; cursor:pointer; font-size:.8rem; font-weight:600; white-space:nowrap; flex-shrink:0;}
  .tag-filter-row{display:flex; gap:.3rem; overflow-x:auto; padding:.45rem 0 .1rem; scrollbar-width:none;}
  .tag-filter-row::-webkit-scrollbar{display:none;}
  .tag-chip{flex-shrink:0; background:var(--bg); border:1px solid var(--border); border-radius:16px; padding:.22rem .55rem; font-size:.7rem; font-weight:600; color:var(--muted); cursor:pointer; transition:all .15s;}
  .tag-chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  nav{display:flex; gap:.4rem; overflow-x:auto; padding:.5rem .8rem; background:var(--surface); border-bottom:1px solid var(--border); scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav a{flex-shrink:0; font-size:.78rem; font-weight:600; color:var(--muted); text-decoration:none; padding:.3rem .6rem; border-radius:16px; background:var(--bg); transition:background .15s;}
  nav a:hover{background:var(--primary-light); color:var(--primary);}
  main{max-width:1100px; margin:auto; padding:.8rem .8rem 3rem;}
  section{margin-bottom:2rem;}
  h2{font-size:1.18rem; color:var(--primary); margin:0 0 .8rem; padding-left:.55rem; border-left:4px solid var(--primary);}
  h3{font-size:1rem; color:var(--text); margin:1.2rem 0 .5rem;}
  h4{font-size:.92rem; color:var(--primary); margin:.8rem 0 .3rem;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1rem 1.1rem; margin-bottom:.8rem; box-shadow:var(--shadow);}
  .card p, .card li{font-size:.87rem; margin:.3rem 0;}
  .card ul{padding-left:1.15rem; margin:.3rem 0;}
  .card .explication{font-size:.84rem; color:var(--muted); margin-top:.4rem; padding-top:.4rem; border-top:1px dashed var(--border);}
  .tag{display:inline-block; font-size:.65rem; font-weight:700; padding:.08rem .4rem; border-radius:8px; margin-right:.2rem; margin-bottom:.15rem; vertical-align:middle; cursor:pointer; background:var(--primary-light); color:var(--primary);}
  .tag:hover{opacity:.7;}
  table{width:100%; border-collapse:collapse; font-size:.8rem; background:var(--surface); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); margin:.6rem 0;}
  th,td{padding:.5rem .55rem; border-bottom:1px solid var(--border); text-align:left; vertical-align:top;}
  th{background:var(--primary-light); color:var(--primary); font-weight:600; font-size:.75rem; white-space:nowrap;}
  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius);}
  .note{background:var(--primary-light); border-left:3px solid var(--primary); padding:.7rem .9rem; border-radius:0 8px 8px 0; font-size:.85rem; margin:.7rem 0;}
  .warn{background:var(--accent-light); border-left:3px solid var(--accent); padding:.7rem .9rem; border-radius:0 8px 8px 0; font-size:.85rem; margin:.7rem 0;}
  a{color:var(--primary); text-decoration:none;}
  a:hover{text-decoration:underline;}
  .ref{font-size:.8rem; color:var(--muted);}
  footer{text-align:center; padding:1.2rem .8rem; font-size:.75rem; color:var(--muted); border-top:1px solid var(--border);}
  .hidden{display:none !important;}
  .loading{text-align:center; padding:2rem; color:var(--muted);}
  @media(min-width:720px){
    header h1{font-size:1.7rem;}
    main{padding:1.2rem 1.5rem 4rem;}
    .card-grid{display:grid; grid-template-columns:1fr 1fr; gap:.7rem;}
    .card-grid .card{margin-bottom:0;}
  }
</style>
</head>
<body>

<header>
  <h1>Ralstonia Web App</h1>
  <p>Cơ sở dữ liệu RSSC – Tự động đồng bộ từ máy chủ trung tâm</p>
  <span class="header-badge" id="lastUpdatedBadge">Đang kết nối...</span>
</header>

<div class="update-panel">
  <button class="update-btn" id="updateBtn" onclick="loadData(true)">🔄 Đồng bộ ngay</button>
  <span class="update-status" id="updateStatus">Đang chờ dữ liệu từ máy chủ...</span>
</div>

<div class="toolbar">
  <div class="search-row">
    <input class="search-input" id="searchInput" type="search" placeholder="🔍 Tìm effector, giải pháp, vùng…" oninput="applyFilter()">
    <button class="theme-btn" onclick="document.body.classList.toggle('dark')">🌗</button>
  </div>
  <div class="tag-filter-row" id="tagFilterRow">
    <button class="tag-chip active" data-tag="all" onclick="setTagFilter(this,'all')">Tất cả</button>
    <button class="tag-chip" data-tag="Effector" onclick="setTagFilter(this,'Effector')">#Effector</button>
    <button class="tag-chip" data-tag="Biocontrol" onclick="setTagFilter(this,'Biocontrol')">#Biocontrol</button>
    <button class="tag-chip" data-tag="Diagnosis" onclick="setTagFilter(this,'Diagnosis')">#Diagnosis</button>
    <button class="tag-chip" data-tag="Vietnam" onclick="setTagFilter(this,'Vietnam')">#Vietnam</button>
    <button class="tag-chip" data-tag="Laos" onclick="setTagFilter(this,'Laos')">#Laos</button>
    <button class="tag-chip" data-tag="China" onclick="setTagFilter(this,'China')">#China</button>
  </div>
</div>

<nav id="mainNav"></nav>

<main id="appContent">
  <div class="loading">⏳ Đang tải dữ liệu khoa học mới nhất...</div>
</main>

<footer>
  Ralstonia Web App – Tự động đồng bộ từ data.json. Dữ liệu cập nhật đến 2026.
</footer>

<script>
const DATA_URL = 'https://gist.githubusercontent.com/epartvn-rgb/e18fd9e48a5619e11663db094c2bd19e/raw/453f72dcd7e91220a0cc685c3b94bf86a076cca5/data.jsonn';
const AUTO_REFRESH_INTERVAL = 300000;
let autoRefreshTimer = null;
let allData = null;

async function loadData(manual = false) {
  const btn = document.getElementById('updateBtn');
  const status = document.getElementById('updateStatus');
  const badge = document.getElementById('lastUpdatedBadge');
  const content = document.getElementById('appContent');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = '⏳ Đang tải...';
  status.className = 'update-status'; status.textContent = 'Đang kết nối máy chủ dữ liệu...';
  try {
    const url = DATA_URL + '?t=' + Date.now();
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    allData = data;
    renderApp(data, content);
    renderNav(data);
    const now = new Date().toLocaleString('vi-VN');
    badge.textContent = 'Cập nhật: ' + now;
    status.className = 'update-status success'; status.textContent = `✅ Đã đồng bộ thành công lúc ${now}`;
  } catch (error) {
    console.error('[Web App] Lỗi tải dữ liệu:', error);
    status.className = 'update-status error';
    status.textContent = `❌ Lỗi: ${error.message}. (URL: ${DATA_URL})`;
    if (content.querySelector('.loading')) {
      content.innerHTML = `<div class="loading" style="color:var(--accent);">❌ Không thể tải dữ liệu. Vui lòng kiểm tra URL của tệp <code>data.json</code>.</div>`;
    }
  } finally {
    btn.disabled = false; btn.textContent = '🔄 Đồng bộ ngay';
  }
}

function renderApp(data, container) {
  let html = '';
  data.sections.forEach(section => {
    html += `<section id="${section.id}"><h2>${section.title}</h2>`;
    if (section.description) html += `<p class="explication" style="margin-bottom:1rem;">${section.description}</p>`;
    if (section.cards) {
      section.cards.forEach(card => {
        const tagHtml = card.tags ? card.tags.map(t => `<span class="tag" onclick="filterByTag('${t}')">#${t}</span>`).join(' ') : '';
        html += `<div class="card" data-tags="${card.tags ? card.tags.join(' ') : ''}">`;
        html += `<h4>${tagHtml} ${card.title}</h4>`;
        if (card.body) html += `<p>${card.body}</p>`;
        if (card.list) html += `<ul>${card.list.map(li => `<li>${li}</li>`).join('')}</ul>`;
        if (card.explication) html += `<div class="explication"><strong>Thuyết minh:</strong> ${card.explication}</div>`;
        if (card.source) html += `<div class="explication" style="font-size:.78rem;">Nguồn: ${card.source}</div>`;
        html += `</div>`;
      });
    }
    if (section.table) {
      html += `<div class="table-wrap"><table><thead><tr>`;
      section.table.headers.forEach(h => html += `<th>${h}</th>`);
      html += `</tr></thead><tbody>`;
      section.table.rows.forEach(row => { html += `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`; });
      html += `</tbody></table></div>`;
    }
    if (section.note) html += `<div class="note">${section.note}</div>`;
    if (section.warning) html += `<div class="warn">${section.warning}</div>`;
    if (section.references) {
      html += `<ol class="ref">`;
      section.references.forEach(ref => { html += `<li>${ref.text} <a href="${ref.url}" target="_blank" rel="noopener">Truy cập</a></li>`; });
      html += `</ol>`;
    }
    html += `</section>`;
  });
  container.innerHTML = html;
}

function renderNav(data) {
  const nav = document.getElementById('mainNav');
  nav.innerHTML = data.sections.map(s => `<a href="#${s.id}">${s.title.split('.')[0]}</a>`).join('');
}

let currentTag = 'all';
function setTagFilter(btn, tag) {
  currentTag = tag;
  document.querySelectorAll('.tag-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); applyFilter();
}
function filterByTag(tag) {
  currentTag = tag;
  document.querySelectorAll('.tag-chip').forEach(b => { b.classList.toggle('active', b.dataset.tag === tag); });
  applyFilter();
}
function applyFilter() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  document.querySelectorAll('[data-tags]').forEach(el => {
    const tags = (el.getAttribute('data-tags') || '').toLowerCase();
    const tagMatch = currentTag === 'all' || tags.includes(currentTag.toLowerCase());
    const textMatch = !q || el.innerText.toLowerCase().includes(q);
    el.classList.toggle('hidden', !(tagMatch && textMatch));
  });
}

function startAutoRefresh() {
  if (AUTO_REFRESH_INTERVAL > 0) {
    autoRefreshTimer = setInterval(() => { if (document.visibilityState === 'visible') loadData(false); }, AUTO_REFRESH_INTERVAL);
  }
}
window.addEventListener('load', () => { loadData(); startAutoRefresh(); });
window.addEventListener('beforeunload', () => { if (autoRefreshTimer) clearInterval(autoRefreshTimer); });
</script>

</body>
</html>
